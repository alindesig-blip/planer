<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой планер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" id="meta-theme" content="#E9DFD0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Телефонный интерфейс: крупный заголовок экрана, цветная карточка-сводка, белые карточки на контрастном фоне, нижняя панель вкладок, редактор в нижней шторке. Цвета задаёт выбранная тема (см. THEMES в скрипте). */
:root{
  --bg:#E9DFD0; --surface:#FBF7F0; --ink:#2E0F15; --muted:#8A7470; --line:#ECE2D4; --soft:#F1E9DD;
  --accent:#6E1F2E; --accent-ink:#FBF7F0; --hero:#5B1A26; --hero-ink:#F5ECDD; --hero-acc:#E9C79F;
  --danger:#C2361F;
  --s1:#D2442A; --s2:#8F8B12; --s3:#2F6B42; --s4:#3D59B8; --s5:#7A62A8; --s6:#B8476A; --s7:#8A2D45; --s8:#A6762A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --r:22px; --navh:58px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:8px calc(var(--navh) + 32px + env(safe-area-inset-bottom,0px))}
p{margin:0}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}

/* заголовок экрана */
.top{padding:14px 4px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:32px;line-height:1.05}
.top .sub{color:var(--muted);font-size:15px;margin-top:4px}
.top .act{color:var(--accent);font-weight:600;font-size:15px;padding:6px 0;white-space:nowrap}

/* карточка-сводка */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:18px;display:flex;gap:16px;align-items:center}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:20px;opacity:.6;font-weight:600}
.hero .lbl{font-size:14px;opacity:.75;margin-top:6px}
.hero .grow{flex:1;min-width:0}
.pair{display:flex;gap:14px;align-items:center;padding:12px 16px;min-height:60px;position:relative}
.pair + .pair::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.pair .tm{flex:none;width:46px;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;line-height:1.2}
.pair .tm small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.pair .bar-v{flex:none;width:4px;align-self:stretch;border-radius:4px;background:var(--c,var(--accent))}
.pair.now{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.pair.past{opacity:.5}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.days::-webkit-scrollbar{display:none}
.dchip{flex:1;min-width:48px;padding:8px 6px;border-radius:14px;background:var(--surface);text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.dchip b{display:block;font-size:17px;color:var(--ink);margin-top:2px}
.days .dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.days .dchip{min-width:0;padding:8px 2px}
.days .dchip[aria-pressed="true"] b,.days .dchip[aria-pressed="true"] .lab{color:var(--accent-ink)}
.dchip[aria-pressed="true"] b{color:var(--accent-ink)}
.dchip .dot2{display:block;width:5px;height:5px;border-radius:50%;background:currentColor;margin:4px auto 0;opacity:.6}
.dchip .dot2.no{opacity:0}
.wk{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.wk button{width:36px;height:36px;border-radius:12px;background:var(--surface);color:var(--accent);font-size:22px;font-weight:600;line-height:1}
.wk span{font-weight:600}
.dchip .lab{display:block;font-size:11px;margin-top:3px;font-weight:700;min-height:13px}
.dchip.w-done{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.dchip.w-done b{color:var(--accent)}
.dchip.w-missed{background:transparent;border:2px dashed color-mix(in srgb,var(--ink) 40%,transparent)}
.dchip.w-missed .lab{color:var(--ink)}
.dchip[aria-pressed="true"] .lab{color:var(--accent-ink)}
.wplate{display:flex;align-items:center;gap:14px;padding:16px}
.wplate .big2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.wcheck{flex:none;padding:12px 16px;border-radius:16px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.wcheck.ok{background:var(--soft);color:var(--accent)}
.wcheck:disabled{background:var(--soft);color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 16px 8px}
.stat div{background:var(--soft);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat .miss b{color:var(--danger)}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.mrow + .mrow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.mrow .grow{flex:1;min-width:0}
.mrow .bar{margin-top:6px}
.best{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:2px 8px;margin-left:6px}
.wplate .grow{flex:1;min-width:0}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px}
.mhero{flex-direction:column;align-items:flex-start;gap:2px}
.mhero .big{font-size:52px;margin-top:4px}
.mhero .big small{font-size:24px}
.mdots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.md{width:15px;height:15px;border-radius:50%;border:2px solid color-mix(in srgb,var(--hero-ink) 35%,transparent)}
.md.done{background:var(--hero-acc);border-color:var(--hero-acc)}
.md.today{border-color:var(--hero-ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--hero-ink) 25%,transparent)}
.mx{margin-top:10px;font-size:13px;font-weight:700;color:var(--hero-ink);background:color-mix(in srgb,var(--hero-ink) 16%,transparent);border:1.5px dashed color-mix(in srgb,var(--hero-ink) 60%,transparent);border-radius:99px;padding:2px 10px}
.scol{display:flex;flex-direction:column;gap:8px;min-width:0}
.rec{background:var(--surface);border-radius:18px;padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.rec b{color:var(--ink);font-size:26px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rec span{font-size:12px;font-weight:600;color:var(--muted)}
.streak{flex:1;background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 6px}
.streak b{font-size:56px;line-height:1;letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.streak span{font-weight:700;margin-top:8px;font-size:15px}
.streak small{font-size:12px;color:var(--muted);margin-top:2px}
.streak.zero b{color:var(--muted)}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:16px}
.mcal .mh{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.mc{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);line-height:1.1}
.mc i{font-style:normal;font-size:9px;font-weight:800;margin-top:2px}
.mc.c-done{background:var(--accent);color:var(--accent-ink)}
.mc.c-miss{border:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);color:var(--ink);background:linear-gradient(to top right,transparent calc(50% - 1px),color-mix(in srgb,var(--ink) 40%,transparent) calc(50% - 1px),color-mix(in srgb,var(--ink) 40%,transparent) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),color-mix(in srgb,var(--ink) 40%,transparent) calc(50% - 1px),color-mix(in srgb,var(--ink) 40%,transparent) calc(50% + 1px),transparent calc(50% + 1px))}
.mc.c-today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--ink)}
.mc.c-plan{background:var(--soft);color:var(--ink)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.rcard{background:var(--soft);border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px;min-width:0}
.rcard svg{width:52px;height:52px;flex:none}
.rcard b{display:block;font-size:16px}
.rcard span{font-size:12px;color:var(--muted)}
.mchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 16px}
.mchip{font-size:13px;font-weight:600;color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);border-radius:99px;padding:5px 10px}
.mbars{display:flex;align-items:stretch;gap:10px;padding:16px;height:190px;overflow-x:auto}
.mb{flex:1;min-width:38px;max-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mcol{flex:1 1 0;min-height:0;width:100%;background:var(--soft);border-radius:10px;position:relative;overflow:hidden}
.mcol i{position:absolute;left:0;right:0;bottom:0;display:block;background:color-mix(in srgb,var(--accent) 45%,var(--soft));border-radius:10px}
.mb.mtop .mcol i,.mb.cur .mcol i{background:var(--accent)}
.mv{font-size:12px;font-weight:700}
.ml{font-size:12px;color:var(--ink);font-weight:600}
.ml2{font-size:11px;color:var(--muted)}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero .chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--hero-ink) 14%,transparent);color:var(--hero-ink)}
.ring{flex:none;width:76px;height:76px}
.ring .trk{stroke:color-mix(in srgb,var(--hero-ink) 18%,transparent)}
.ring .val{stroke:var(--hero-acc);transition:stroke-dashoffset .4s}
.ring text{fill:var(--hero-ink);font-size:17px;font-weight:700;font-family:var(--font)}

/* секции и карточки */
section{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px 10px}
.sh h2{font-size:21px}
.sh .act{color:var(--accent);font-weight:600;font-size:15px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden}
.card + .card{margin-top:10px}
.pad{padding:16px}

/* строки задач */
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c,var(--accent)) 70%,transparent);display:grid;place-items:center}
.chk svg{width:15px;height:15px;opacity:0;color:var(--surface)}
.done .chk{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.done .chk svg{opacity:1}
.rm{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.rt{font-size:16px;overflow-wrap:anywhere}
.rs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .rt{text-decoration:line-through;color:var(--muted)}
.ib{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px}
.ib.on{color:var(--accent);background:var(--soft)}
.pips{display:flex;gap:4px;flex:none}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c,var(--accent)) 60%,transparent)}
.pip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.pill-btn{flex:none;font-size:14px;font-weight:600;color:var(--accent);background:var(--soft);padding:8px 12px;border-radius:12px}
.pill-btn.ok{color:var(--muted);background:none}

/* поле добавления */
.add{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;position:relative}
.add::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.add:first-child::before{display:none}
.add .plus{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-size:20px;font-weight:600;line-height:1}
.add input{flex:1;min-width:0;border:0;background:none;padding:6px 0;outline:none}
.add input::placeholder{color:var(--muted)}

/* проекты */
.proj{display:block;width:100%;text-align:left;padding:16px}
.ph{display:flex;align-items:center;gap:12px}
.dot{flex:none;width:40px;height:40px;border-radius:14px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:15px}
.pm{flex:1;min-width:0}
.pt{font-size:17px;font-weight:600;line-height:1.25}
.ps{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.ps .warn{color:var(--danger);font-weight:600}
.pn{flex:none;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));transition:width .3s}
.ptools{display:flex;gap:8px;padding:4px 16px 16px}
.tool{flex:1;font-size:15px;font-weight:600;color:var(--accent);background:var(--soft);padding:11px 8px;border-radius:14px;text-align:center}

/* график по предметам */
.chart{padding:16px;display:flex;flex-direction:column;gap:12px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.cr .cl{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .cn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cr .bar{grid-column:1/-1;margin-top:0;height:8px}

/* сегменты */
.seg{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:14px;padding:3px;gap:2px;margin:0 0 14px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* большая кнопка */
.wide{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:18px;background:var(--surface);color:var(--accent);font-weight:600;font-size:16px;margin-top:10px}
.wide.solid{background:var(--accent);color:var(--accent-ink)}

/* меню «Ещё» */
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:56px;position:relative}
.li + .li::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.li .lt{flex:1;font-size:16px}
.li .lv{color:var(--muted);font-size:15px}
.li svg{width:18px;height:18px;color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:16px}
.th{border-radius:18px;padding:10px;background:var(--soft);display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:2px solid transparent}
.th[aria-pressed="true"]{border-color:var(--accent)}
.th .sw{display:flex;width:100%;height:44px;border-radius:12px;overflow:hidden}
.th .sw i{flex:1}
.th span{font-size:13px;font-weight:600}

/* нижняя панель */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;margin:0 auto}
.tab{height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.tab svg{width:25px;height:25px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .n{position:absolute;top:6px;left:calc(50% + 8px);font-size:11px;min-width:18px;height:18px;line-height:18px;border-radius:99px;background:var(--accent);color:var(--accent-ink);padding:0 5px;font-variant-numeric:tabular-nums}

/* шторка */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(20,8,10,.38)}
.sheet{position:relative;width:100%;max-width:520px;max-height:90vh;max-height:90dvh;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sheet-head h2{font-size:20px}
.sheet-head .done-btn{color:var(--accent);font-weight:700;font-size:16px;padding:6px 2px}
.sheet-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.fl{font-size:13px;color:var(--muted);padding:14px 4px 6px;font-weight:600}
.field{display:block;width:100%;border:0;background:var(--surface);border-radius:14px;padding:13px 14px;outline:none}
.field:focus{box-shadow:0 0 0 2px var(--accent) inset}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.er{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;min-height:52px;position:relative}
.er + .er::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.er input{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline:none}
.er select{flex:none;border:0;background:var(--soft);border-radius:10px;padding:6px 8px;font-size:14px}
.danger{color:var(--danger)}
.wide.danger{color:var(--danger)}
.armed{background:var(--danger)!important;color:#fff!important}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:16px;display:flex;gap:16px;align-items:center;font-size:15px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast button{color:inherit;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app" id="view"></main>
<nav class="tabs" aria-label="Разделы"><div class="tabs-in" id="tabs" role="tablist"></div></nav>
<div id="sheet" class="sheet-wrap" hidden><div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2 id="sheet-title"></h2><button class="done-btn" data-act="close">Готово</button></div><div class="sheet-body" id="sheet-body"></div></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const KEY='planer.v2';

function dlText(dl){
  if(!dl)return '';
  const days=Math.round((new Date(dl+'T00:00')-new Date(T()+'T00:00'))/864e5);
  const [,m,d]=dl.split('-').map(Number);
  if(days<0)return `<span class="warn">просрочено</span>`;
  if(days===0)return `<span class="warn">сдать сегодня</span>`;

  return `до ${d} ${MONTHS[m-1]}`;
}

function streaks(){
  let best=0,run=0;const t=T();let d=new Date(D.sport.start+'T12:00');
  for(let i=0;i<4000;i++){const ds=ymd(d);if(ds>t)break;const st=wStatus(ds);if(st==='done'){run++;best=Math.max(best,run)}else if(st==='missed')run=0;d.setDate(d.getDate()+1)}
  return{cur:run,best};
}
function monthStats(y,m){
  const r={planned:0,done:0,missed:0,left:0,total:0,by:{up:{p:0,d:0,t:0,m:0},low:{p:0,d:0,t:0,m:0}},missList:[],list:[]};
  const n=new Date(y,m+1,0).getDate();
  for(let i=1;i<=n;i++){const ds=`${y}-${pad(m+1)}-${pad(i)}`;const w=workoutOn(ds);if(!w)continue;const st=wStatus(ds),g=r.by[wGroup(w)];
    r.total++;g.t++;r.list.push([ds,w,st]);
    if(st==='future'){r.left++;continue}
    r.planned++;g.p++;
    if(st==='done'){r.done++;g.d++}else if(st==='missed'){r.missed++;g.m++;r.missList.push([ds,w])}}
  return r;
}
function miniRing(d,n){
  const p=n?d/n:0,C=2*Math.PI*21;
  return `<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="21" fill="none" stroke-width="6" style="stroke:color-mix(in srgb,var(--ink) 10%,transparent)"/><circle cx="26" cy="26" r="21" fill="none" stroke-width="6" stroke-linecap="round" style="stroke:var(--accent)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 26 26)"/><text x="26" y="31" text-anchor="middle" style="fill:var(--ink);font:700 12px var(--font)">${Math.round(p*100)}%</text></svg>`;
}

    <div class="card">${plate}</div>

    </div>

/* ---------- расписание ДГТУ (edu.donstu.ru) ---------- */
const RASP_API='https://edu.donstu.ru/api/';
const monday=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const acYear=()=>{const d=new Date(),y=d.getFullYear();return d.getMonth()>=7?`${y}-${y+1}`:`${y-1}-${y}`};
const loading=new Set();
async function loadWeek(mon,force){
  const key=ymd(mon);
  if(!D.rasp||!D.rasp.groupId||loading.has(key))return;
  const c=D.raspCache[key];if(c&&!force&&Date.now()-c.at<2*3600e3)return;
  loading.add(key);
  try{
    const r=await fetch(RASP_API+'Rasp?idGroup='+D.rasp.groupId+'&sdate='+key);
    const j=await r.json();
    const items=((j.data&&j.data.rasp)||[]).map(x=>({d:String(x['дата']).slice(0,10),s:x['начало']||'',e:x['конец']||'',n:x['дисциплина']||'',a:x['аудитория']||''}));
    D.raspCache[key]={at:Date.now(),items};
    const keys=Object.keys(D.raspCache).sort();while(keys.length>8)delete D.raspCache[keys.shift()];
    save();render(false);
  }catch(e){}finally{loading.delete(key)}
}
const splitDisc=n=>{const m=n.match(/^(лек|лаб|пр|практ|сем)\.?\s+(.*)$/i);return m?{type:m[1].toLowerCase(),name:m[2]}:{type:'',name:n}};
const TYPE_NAME={'лек':'лекция','лаб':'лаб.','пр':'практика','практ':'практика','сем':'семинар'};
function pairsOn(dateStr){
  const c=D.raspCache[ymd(monday(new Date(dateStr+'T12:00')))];
  if(!c)return null;
  return c.items.filter(x=>x.d===dateStr).sort((a,b)=>a.s.localeCompare(b.s));
}
const norm=s=>String(s||'').toLowerCase().replace(/[^а-яёa-z]/g,'');
function subjMatch(subject,disc){const a=norm(subject),b=norm(disc);return !!a&&!!b&&(b.includes(a)||a.includes(b))}
function subjectsToday(){
  const ps=pairsOn(T());
  const subs=[...new Set(Object.values(D.projects).map(p=>p.subject).filter(Boolean))];
  if(ps)return subs.filter(s=>ps.some(x=>subjMatch(s,splitDisc(x.n).name)));
  return scheduleFor(WD[new Date().getDay()]).map(s=>s.subject);
}
function pairColor(disc){const p=Object.values(D.projects).find(p=>p.subject&&subjMatch(p.subject,disc));return p?colorOf(p.subject):'var(--accent)'}
function pairsList(dateStr){
  const ps=pairsOn(dateStr);
  if(ps===null){
    const wd=WD[new Date(dateStr+'T12:00').getDay()],man=scheduleFor(wd);
    if(!man.length)return `<div class="card"><p class="empty">${D.rasp&&D.rasp.groupId?'Загружаю расписание…':'Пар нет'}</p></div>`;
    return `<div class="card">${man.map(m=>`<div class="pair" style="--c:${colorOf(m.subject)}"><span class="bar-v"></span><span class="rm"><span class="rt">${esc(m.subject)}</span>${m.note?`<span class="rs">${esc(m.note)}</span>`:''}</span></div>`).join('')}</div>`;
  }
  if(!ps.length)return `<div class="card"><p class="empty">Пар нет</p></div>`;
  const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes()),isToday=dateStr===T();
  return `<div class="card">${ps.map(x=>{const {type,name}=splitDisc(x.n);const st=isToday?(hm>=x.e?' past':hm>=x.s?' now':''):'';
    return `<div class="pair${st}" style="--c:${pairColor(name)}"><span class="tm">${esc(x.s)}<small>${esc(x.e)}</small></span><span class="bar-v"></span><span class="rm"><span class="rt">${esc(name)}</span><span class="rs">${esc([TYPE_NAME[type]||type,x.a].filter(Boolean).join(' · '))}</span></span></div>`}).join('')}</div>`;
}
let raspWeek=0,raspDay=null;
function weekBlock(){
  const mon=addDays(monday(new Date()),raspWeek*7);loadWeek(mon);
  const days=[0,1,2,3,4,5].map(i=>addDays(mon,i));
  if(!raspDay||!days.some(d=>ymd(d)===raspDay))raspDay=raspWeek===0&&new Date().getDay()!==0?T():ymd(days[0]);
  const end=days[5];
  const lbl=mon.getMonth()===end.getMonth()?`${mon.getDate()}–${end.getDate()} ${MONTHS[end.getMonth()]}`:`${mon.getDate()} ${MONTHS[mon.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;
  const c=D.raspCache[ymd(mon)];
  return `<section><div class="sh"><h2>${esc(L('h_rasp'))}</h2><button class="act" data-act="sheet" data-type="schedule">${esc((D.rasp&&D.rasp.groupName)||'Группа')}</button></div>
    <div class="wk"><button data-act="wk" data-d="-1" aria-label="Предыдущая неделя">‹</button><span>${raspWeek===0?L('t_thisweek'):raspWeek===1?'Следующая неделя':lbl}</span><button data-act="wk" data-d="1" aria-label="Следующая неделя">›</button></div>
    <div class="days">${days.map(d=>{const k=ymd(d),has=c&&c.items.some(x=>x.d===k);return `<button class="dchip" aria-pressed="${k===raspDay}" data-act="rday" data-id="${k}">${WD_SHORT[WD[d.getDay()]]}<b>${d.getDate()}</b><span class="dot2${has?'':' no'}"></span></button>`}).join('')}</div>
    ${pairsList(raspDay)}</section>`;
}

function render(withSheet=true){
  applyTheme();renderTabs();
  const v=document.getElementById('view');
  const a=document.activeElement;
  const keep=a&&a.id&&v.contains(a)?{id:a.id,val:a.value}:null;
  v.innerHTML=tab==='today'?viewToday():tab==='study'?viewArea('study'):tab==='life'?viewLife():viewMore();

function renderTabs(){
  const n=entries(D.tasks).filter(([,x])=>!x.archived&&x.today===T()&&!isDone(x)).length;
  document.getElementById('tabs').innerHTML=TABS.map(a=>`<button class="tab" role="tab" aria-selected="${a.id===tab}" data-act="tab" data-id="${a.id}">${ICON[a.icon]}<span>${esc(L(a.id))}</span>${a.id==='today'&&n?`<span class="n">${n}</span>`:''}</button>`).join('');

function taskRow(id,t,o={}){

  const trail=o.move?`<button class="pill-btn" data-act="today" data-id="${id}">Сегодня</button>`:o.plan?`<button class="pill-btn ok" data-act="today" data-id="${id}" aria-label="Убрать из плана на сегодня">Убрать</button>`
    :`<button class="ib${onToday?' on':''}" data-act="today" data-id="${id}" aria-label="${onToday?'Убрать из плана':'В план на сегодня'}">${ICON.sun}</button>`;
  return `<div class="row${done?' done':''}" style="--c:${colorOf(p?p.subject:'')}">

}

function areaBlock(area,extra='',noHero=false){
  const all=projList(area),active=all.filter(([,p])=>!p.later),later=all.filter(([,p])=>p.later);
  const loose=looseOf(area);
  const allTasks=entries(D.tasks).filter(([,t])=>{const p=t.projectId?D.projects[t.projectId]:null;return p?(p.area===area&&!p.later):t.area===area});
  const u=units(allTasks);
  // график по предметам/категориям
  const groups={};
  for(const[id,p]of active){const k=p.subject||p.title;const g=groups[k]=groups[k]||{d:0,n:0,c:colorOf(p.subject)};const x=units(tasksOf(id));g.d+=x.d;g.n+=x.n}
  const chart=Object.entries(groups).filter(([,g])=>g.n);
  const dn=doneIds(loose);
  return `
  ${noHero?'':`<div class="hero">

/* ---------- действия ---------- */
function parseTitle(raw){
  let title=raw.trim(),target=0;
  const m=title.match(/^(.*?)[\s—–\-:,]*(\d{1,2})\s*шт\.?$/i);
  if(m&&+m[2]>1&&+m[2]<=20&&m[1].trim()){title=m[1].trim();target=+m[2]}
  return{title,target};
}
function newTask(base,raw){
  const{title,target}=parseTitle(raw);if(!title)return false;
  D.tasks[uid('t')]={title,projectId:'',area:'',done:false,target,count:0,today:'',order:Date.now(),...base};
  save();return true;
}
let undo=null,toastTimer=null;
function toast(msg,undoFn){
  const el=document.getElementById('toast');undo=undoFn||null;
  el.innerHTML=esc(msg)+(undoFn?'<button data-act="undo">Вернуть</button>':'');
  el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;undo=null},4500);
}
const armed=new Map();
function arm(b,key,label,fn){
  if(armed.get(key)){armed.delete(key);fn();return}
  const orig=b.textContent;armed.set(key,1);b.textContent=label;b.classList.add('armed');
  setTimeout(()=>{armed.delete(key);if(b.isConnected){b.textContent=orig;b.classList.remove('armed')}},3000);
}
function restore(text){
  try{const d=JSON.parse(text);if(!d||typeof d.projects!=='object'||typeof d.tasks!=='object')throw 0;
    D={...d,v:2,schedule:d.schedule||seed().schedule,lastBackup:d.lastBackup||'',theme:d.theme||D.theme||'painting',sport:d.sport||newSport(),trash:d.trash||[],rasp:d.rasp||D.rasp,raspCache:d.raspCache||{}};save();sheet=null;tab='today';render();toast('Копия загружена');
  }catch(e){toast('Это не копия планера')}
}
function markBackup(){D.lastBackup=T();save();render()}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const act=b.dataset.act,id=b.dataset.id,t=D.tasks[id];
  if(act==='tab'){tab=id;lsSet('planer.tab',tab);window.scrollTo(0,0);render();return}
  if(act==='life'){lifeArea=id;lsSet('planer.life2',id);render();return}
  if(act==='close'){closeSheet();return}
  if(act==='sheet'){openSheet({type:b.dataset.type,pid:id,area:b.dataset.area});return}
  if(act==='expand'){open.has(id)?open.delete(id):open.add(id);lsSet('planer.open',[...open]);render();return}
  if(act==='theme'){D.theme=id;save();render();return}
  if(act==='toggle'&&t){
    if(t.target>0){const full=(t.count||0)>=t.target;t.count=full?0:t.target;t.done=!full}else t.done=!t.done;
    save();render();
  }
  if(act==='pip'&&t){const i=+b.dataset.i;t.count=(t.count||0)===i+1?i:i+1;t.done=t.count>=t.target;save();render()}
  if(act==='today'&&t){t.today=t.today===T()?'':T();save();render()}
  if(act==='move-all'){const t0=T();for(const[,x]of entries(D.tasks))if(!x.archived&&x.today&&x.today<t0&&!isDone(x))x.today=t0;save();render()}
  if(act==='archive'){
    const ids=(b.dataset.ids||'').split(',').filter(i=>D.tasks[i]);const t0=T();
    ids.forEach(i=>{D.tasks[i].archived=true;D.tasks[i].archivedAt=t0});save();render();
    toast(`${ids.length} ${plural(ids.length,'дело','дела','дел')} в «Выполненных»`,()=>{ids.forEach(i=>{if(D.tasks[i]){D.tasks[i].archived=false;delete D.tasks[i].archivedAt}});save();render()});
  }
  if(act==='unarchive'&&t){t.archived=false;delete t.archivedAt;save();render();toast('Дело вернулось')}
  if(act==='untrash'){const k=+b.dataset.i,x=D.trash[k];if(!x)return;D.trash.splice(k,1);
    if(x.kind==='task'){const d={...x.data};if(d.projectId&&!D.projects[d.projectId]){d.area=d.area||'personal';d.projectId=''}D.tasks[x.id]=d}
    else{D.projects[x.id]=x.data;x.tasks.forEach(([tid,tt])=>D.tasks[tid]=tt)}
    save();render();toast('Восстановлено');return}
  if(act==='clear-trash')arm(b,'trash','Удалить навсегда?',()=>{D.trash=[];save();render()});
  if(act==='clear-arch')arm(b,'clear','Удалить навсегда?',()=>{for(const[i,x]of entries(D.tasks))if(x.archived)delete D.tasks[i];save();render()});
  if(act==='del'&&t){const item={kind:'task',id,data:{...t},at:Date.now()};delete D.tasks[id];D.trash.unshift(item);save();render();toast('Задача в «Удалённых»',()=>{D.trash=D.trash.filter(x=>x!==item);D.tasks[id]=item.data;save();render()})}
  if(act==='undo'&&undo){undo();undo=null;document.getElementById('toast').hidden=true}
  if(act==='later'){const p=D.projects[id];if(p){p.later=!p.later;save();render()}}
  if(act==='pdel')arm(b,'p'+id,'Нажми ещё раз, чтобы удалить',()=>{
    const p=D.projects[id],ts=tasksOf(id);const item={kind:'project',id,data:p,tasks:ts,at:Date.now()};delete D.projects[id];ts.forEach(([tid])=>delete D.tasks[tid]);D.trash.unshift(item);save();closeSheet();
    toast('Проект в «Удалённых»',()=>{D.trash=D.trash.filter(x=>x!==item);D.projects[id]=p;ts.forEach(([tid,tt])=>D.tasks[tid]=tt);save();render()});
  });
  if(act==='create'){
    const title=document.getElementById('n-title').value.trim();if(!title){document.getElementById('n-title').focus();return}
    const pid=uid('p');D.projects[pid]={title,subject:document.getElementById('n-subj').value.trim(),area:b.dataset.area,day:'',deadline:'',later:false,note:'',order:Date.now()};
    save();open.add(pid);lsSet('planer.open',[...open]);sheet={type:'edit',pid};render();
    setTimeout(()=>document.getElementById('e-add')?.focus(),50);
  }
  if(act==='wdone'){toggleWorkout(id);return}
  if(act==='swk'){sportWeek+=+b.dataset.d;sportDay=null;render();return}
  if(act==='sday'){sportDay=id;render();return}
  if(act==='save-sport'){
    const days={};document.querySelectorAll('[data-sp]').forEach(x=>{if(x.value)days[x.dataset.sp]=x.value});
    const t0=T();D.sport.plans=D.sport.plans.filter(p=>p.from!==t0);D.sport.plans.push({from:t0,days});
    save();closeSheet();toast('Расписание тренировок сохранено');return;
  }
  if(act==='wk'){raspWeek+=+b.dataset.d;raspDay=null;render();return}
  if(act==='rday'){raspDay=id;render();return}
  if(act==='grp'){
    const name=document.getElementById('grp').value.trim().toUpperCase();if(!name)return;
    b.textContent='Ищу…';
    try{
      const r=await fetch(RASP_API+'raspGrouplist?year='+acYear());const j=await r.json();
      const g=(j.data||[]).find(x=>String(x.name).toUpperCase()===name);
      if(!g){toast('Группа не найдена');b.textContent='Подключить';return}
      D.rasp={groupId:g.id,groupName:g.name};D.raspCache={};save();
      await loadWeek(monday(new Date()),true);render();toast('Расписание '+g.name+' подключено');
    }catch(e){toast('Нет связи с сайтом ДГТУ');b.textContent='Подключить'}
    return;
  }
  if(act==='lo'){
    sheet.vals=sheet.vals||{};document.querySelectorAll('[data-label]').forEach(i=>sheet.vals[i.dataset.label]=i.value);
    const o=sheet.order,k=o.indexOf(id),n=k+(+b.dataset.d);if(n<0||n>=o.length)return;[o[k],o[n]]=[o[n],o[k]];renderSheet();return;
  }
  if(act==='save-labels'){
    const lb={};document.querySelectorAll('[data-label]').forEach(i=>{const v=i.value.trim();if(v&&v!==LABELS[i.dataset.label])lb[i.dataset.label]=v;if(!v&&i.dataset.label==='studySub')lb.studySub=' '});
    D.labels=lb;if(sheet.order)D.lifeOrder=sheet.order.slice();save();closeSheet();toast('Названия сохранены');return;
  }
  if(act==='export'){
    const name='planer-'+T()+'.json',text=JSON.stringify(D);
    try{const file=new File([text],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Копия планера'});markBackup();toast('Копия сохранена');return}
    }catch(err){if(err&&err.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();markBackup();toast('Файл скачан');
  }
  if(act==='copy'){
    try{await navigator.clipboard.writeText(JSON.stringify(D));markBackup();toast('Скопировано')}
    catch(err){const ta=document.getElementById('imp-text');ta.value=JSON.stringify(D);ta.select();toast('Выдели текст и скопируй')}
  }
  if(act==='import-text'){const v=document.getElementById('imp-text').value.trim();if(v)arm(b,'imp','Заменить всё?',()=>restore(v))}
  if(act==='reset')arm(b,'reset','Точно сбросить?',()=>{const th=D.theme;D=seed();D.theme=th;save();sheet=null;tab='today';render();toast('Планер сброшен')});
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.pedit){const p=D.projects[sheet&&sheet.pid];if(p){p[el.dataset.pedit]=el.value.trim();save();render(false)}}
  if(el.dataset.edit==='title'){const t=D.tasks[el.dataset.id];const v=el.value.trim();if(t&&v){t.title=v;save();render(false)}else if(t)el.value=t.title}
  if(el.dataset.edit==='target'){const t=D.tasks[el.dataset.id];if(t){const n=+el.value;t.target=n>1?n:0;t.count=Math.min(t.count||0,t.target);t.done=t.target?t.count>=t.target:!!t.done;save();render(false)}}
  if(el.dataset.sched){D.schedule=D.schedule||{days:{}};D.schedule.days[el.dataset.sched]=el.value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const[subject,note]=s.split('·').map(x=>x.trim());return note?{subject,note}:{subject}});save();render(false)}
  if(el.id==='imp-file'&&el.files[0]){const r=new FileReader();r.onload=()=>restore(String(r.result));r.readAsText(el.files[0]);el.value=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.er input,.field:not(textarea)')){e.preventDefault();e.target.blur()}});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();const i=f.querySelector('input');const v=i.value;const k=f.dataset.form;let ok=false;
  if(k==='today')ok=newTask({area:'personal',today:T()},v);
  if(k==='sub'){const p=D.projects[f.dataset.id];ok=newTask({projectId:f.dataset.id,area:p?p.area:''},v)}
  if(k==='loose')ok=newTask({area:f.dataset.area},v);
  if(ok){i.value='';render();const n=document.getElementById(i.id);if(n){n.value='';n.focus()}}
});
let lastDay=T();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T()!==lastDay){lastDay=T();render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
